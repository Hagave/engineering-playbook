name: tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the status check the branch rulesets require: renaming it
  # means updating .github/rulesets/branches-checks.json in the same change.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The floor the hooks require (PEP 604 annotations at import time): a
      # newer interpreter would not catch a feature the floor lacks.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Unit, structural and e2e suites
        run: python3 tests/run_all.py
      # The Codex hooks run as scripts; this is the only suite that executes
      # all of them (a SessionStart that did not compile once reached develop).
      - name: Codex adapter smoke
        run: bash tests/test_codex_behavior.sh
